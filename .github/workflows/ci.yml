name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries (weasyprint deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf2.0-0 libffi-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov mypy ruff

      - name: Run Ruff (linter)
        run: ruff check .

      - name: Run MyPy (type checker)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests with coverage
        # xvfb-run provides a virtual display for PySide6 / QWebEngine
        run: xvfb-run --auto-servernum pytest tests/ test_exports.py -v --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (weasyprint deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf2.0-0 libffi-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: xvfb-run --auto-servernum pyinstaller --onefile --name smart-markdown-editor src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-markdown-editor
          path: dist/smart-markdown-editor
